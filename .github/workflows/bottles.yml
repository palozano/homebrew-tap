name: brew bottles

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bottle
        required: true
        default: todolog

jobs:
  bottle:
    strategy:
      matrix:
        os: [macos-26, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Build bottle
        run: |
          tap="$(printf '%s\n' "$GITHUB_REPOSITORY" | sed 's#/homebrew-#/#')"
          formula="${{ inputs.formula }}"
          ref="$tap/$formula"
          brew tap "$tap" "https://github.com/$GITHUB_REPOSITORY"
          version="$(brew info --json=v2 "$ref" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["versions"]["stable"]')"

          brew install --build-bottle "$ref"
          brew bottle --json --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$formula-$version" "$ref"

      - name: Upload bottle artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
